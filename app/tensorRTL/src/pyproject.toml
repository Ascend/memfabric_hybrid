[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor_rtl"
version = "0.1.0"
description = "library for parallel tensor redistribution"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # "numpy>=1.20",
    # "torch>=1.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tensor_rtl", "tensor_rtl.*"]